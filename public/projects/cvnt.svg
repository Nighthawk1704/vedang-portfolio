<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="400" height="300" fill="#050505"/>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="0.5" stop-color="#c9c9c9"/><stop offset="1" stop-color="#6f6f6f"/>
    </linearGradient>
  </defs>
  <!-- big index number -->
  <text x="34" y="185" font-weight="800" font-size="96" fill="url(#silver)" letter-spacing="-4">001</text>
  <!-- country + explore -->
  <text x="42" y="212" font-size="10" fill="#e8e8e8">▾  🇮🇳 INDIA</text>
  <rect x="118" y="200" width="118" height="20" rx="10" fill="#ff3b3b"/>
  <text x="177" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">EXPLORE PRODUCTS</text>
  <!-- right menu -->
  <g fill="#ffffff" font-weight="700" font-size="20">
    <text x="300" y="120">menu</text>
    <text x="288" y="146">signup/in</text>
    <text x="288" y="172">instagram</text>
  </g>
  <g fill="#8a8a8a" font-size="8" font-style="italic">
    <text x="276" y="116">(08)</text><text x="272" y="142">(01)</text><text x="300" y="168">(01)</text>
  </g>
  <!-- subtle silhouette suggestion (fashion figure), no detail -->
  <ellipse cx="210" cy="150" rx="60" ry="110" fill="#141414"/>
  <ellipse cx="210" cy="96" rx="20" ry="24" fill="#1c1c1c"/>
  <text x="34" y="270" font-size="9" fill="#5a5a5a" font-style="italic">CVNT — 001 · fashion drop, Next.js 14 · GSAP</text>
</svg>
