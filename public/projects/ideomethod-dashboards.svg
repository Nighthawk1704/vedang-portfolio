<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="400" height="300" fill="#f5f6f9"/>
  <!-- sidebar -->
  <rect width="70" height="300" fill="#1d2433"/>
  <circle cx="20" cy="24" r="7" fill="#5b8def"/><text x="34" y="28" font-size="9" fill="#eef" font-weight="700">ideo</text>
  <g fill="#8b93a7" font-size="7.5">
    <rect x="12" y="52" width="46" height="14" rx="3" fill="#2b3346"/><text x="18" y="62" fill="#cdd">Overview</text>
    <text x="18" y="84">Modules</text><text x="18" y="104">Reports</text><text x="18" y="124">Settings</text>
  </g>
  <!-- topbar -->
  <text x="86" y="30" font-size="12" font-weight="700" fill="#222a3a">Dashboard</text>
  <rect x="300" y="18" width="84" height="18" rx="9" fill="#e7ebf3"/><text x="342" y="30" text-anchor="middle" font-size="7.5" fill="#5a6478">Last 30 days ▾</text>
  <!-- stat cards -->
  <g>
    <rect x="86" y="46" width="94" height="52" rx="6" fill="#fff" stroke="#e6e9f0"/>
    <text x="96" y="64" font-size="7.5" fill="#8b93a7">API calls</text><text x="96" y="84" font-size="16" font-weight="700" fill="#222a3a">−40%</text>
    <rect x="188" y="46" width="94" height="52" rx="6" fill="#fff" stroke="#e6e9f0"/>
    <text x="198" y="64" font-size="7.5" fill="#8b93a7">Components</text><text x="198" y="84" font-size="16" font-weight="700" fill="#222a3a">15+</text>
    <rect x="290" y="46" width="94" height="52" rx="6" fill="#fff" stroke="#e6e9f0"/>
    <text x="300" y="64" font-size="7.5" fill="#8b93a7">Cache hit</text><text x="300" y="84" font-size="16" font-weight="700" fill="#3aa06a">87%</text>
  </g>
  <!-- chart -->
  <rect x="86" y="108" width="196" height="120" rx="6" fill="#fff" stroke="#e6e9f0"/>
  <text x="96" y="126" font-size="8" fill="#5a6478">Requests / day</text>
  <polyline points="96,208 120,188 144,196 168,168 192,176 216,150 240,158 264,138" fill="none" stroke="#5b8def" stroke-width="2.5"/>
  <polyline points="96,214 120,206 144,210 168,200 192,204 216,196 240,200 264,190" fill="none" stroke="#c7d2ea" stroke-width="2"/>
  <!-- list -->
  <rect x="290" y="108" width="94" height="120" rx="6" fill="#fff" stroke="#e6e9f0"/>
  <g font-size="7.5" fill="#5a6478">
    <text x="300" y="126" fill="#222a3a" font-weight="700">Modules</text>
    <text x="300" y="146">Onboarding ✓</text><text x="300" y="164">Billing ✓</text>
    <text x="300" y="182">Reports ⟳</text><text x="300" y="200">Exports ✓</text>
  </g>
  <text x="86" y="250" font-size="8" fill="#98a0b3">React · Next.js · TypeScript — refactored for fewer calls</text>
